<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Jungle Studio | Plantas e Estilo de Vida</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🎨 CÓDIGO CSS (Estilização Avançada) -->
    <style>
        /* --- DESIGN CORE (TEMA CLARO) --- */
        :root {
            --bg-base: #f9f8f4;
            --bg-navbar: rgba(249, 248, 244, 0.85);
            --bg-surface: #ffffff;
            --text-main: #18221c;
            --text-muted: #5e6b62;
            --brand-color: #2a4736; /* Verde Nobre */
            --brand-light: #e8edea;
            --accent-terracota: #c87a53;
            --shadow-blur: rgba(24, 34, 28, 0.05);
            --border-line: #e3e8e4;
            --system-delete: #d14d4d;
        }

        /* --- DESIGN CORE (TEMA ESCURO) --- */
        body.dark {
            --bg-base: #0a0f0c;
            --bg-navbar: rgba(10, 15, 12, 0.85);
            --bg-surface: #121915;
            --text-main: #edf2ee;
            --text-muted: #8ba093;
            --brand-color: #5ea378; 
            --brand-light: #16241c;
            --accent-terracota: #e28f67;
            --shadow-blur: rgba(0, 0, 0, 0.5);
            --border-line: #1e2b22;
        }

        /* --- CONFIGURAÇÕES BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- APARÊNCIA DA BARRA DE NAVEGAÇÃO --- */
        header {
            background-color: var(--bg-navbar);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-line);
        }

        .studio-logo {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--text-main);
        }

        .studio-logo span {
            color: var(--accent-terracota);
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botão Tema */
        .btn-theme-switcher {
            background-color: var(--text-main);
            color: var(--bg-base);
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-theme-switcher:hover {
            transform: translateY(-1px);
        }

        /* Widget do Carrinho */
        .cart-widget {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            background-color: var(--brand-light);
            padding: 10px 18px;
            border-radius: 4px;
            border: 1px solid var(--border-line);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        /* --- HERO BANNER --- */
        .hero-banner {
            position: relative;
            background: url('https://unsplash.com') no-repeat center center/cover;
            height: 60vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
        }

        .hero-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(10, 15, 12, 0.85) 35%, rgba(0, 0, 0, 0.2));
            z-index: 1;
        }

        .hero-inner-content {
            position: relative;
            z-index: 2;
            max-width: 580px;
            color: #ffffff;
        }

        .hero-inner-content .tagline {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-terracota);
            display: block;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .hero-inner-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .hero-inner-content p {
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #dae5df;
            font-weight: 300;
        }

        .btn-discover {
            background-color: var(--accent-terracota);
            color: white;
            padding: 15px 36px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(200, 122, 83, 0.3);
            transition: all 0.2s;
        }

        .btn-discover:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* --- VITRINE E FILTROS --- */
        .workspace-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 24px;
        }

        .section-headline {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-headline h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .section-headline p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Abas de Filtragem Funcionais */
        .filter-tabs-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 50px;
        }

        .btn-filter {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-line);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-filter.active, .btn-filter:hover {
            background-color: var(--brand-color);
            color: var(--bg-surface);
            border-color: var(--brand-color);
        }

        /* GRID DE PRODUTOS */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .product-card-unit {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-line);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--shadow-blur);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card-unit:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px var(--shadow-blur);
        }

        .media-holder {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
        }

        .media-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--brand-color);
            color: white;
            padding: 4px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 2px;
        }

        .info-holder {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-holder h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-holder .summary-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .footer-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .btn-add-stock {
            background-color: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-stock:hover {
            background-color: var(--text-main);
            color: var(--bg-surface);
        }
